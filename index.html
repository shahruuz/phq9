<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HMW Assessment">
    <meta name="theme-color" content="#F4EFE6">
    <title>Client Self-Assessment Tool • Her Mind & Wellness</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #F8F6F0;
            --bg-card: #FFFFFF;
            --primary: #2C4A3E;
            --primary-hover: #1E332B;
            --primary-light: #E8F0EC;
            --accent: #D4A373;
            --text-main: #2D3732;
            --text-muted: #6B7C73;
            --border: #E3EDE7;
            --border-focus: #2C4A3E;
            --danger: #A33333;
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --shadow-subtle: 0 4px 24px rgba(44, 74, 62, 0.05);
            --shadow-card: 0 12px 36px rgba(44, 74, 62, 0.07);
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            width: 100%;
            height: 100%;
            height: 100vh;
            height: 100dvh;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-main);
            font-size: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #hmw-assessment-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at top right, #FAF8F5 0%, var(--bg-canvas) 100%);
            overflow: hidden;
            position: relative;
        }

        .hmw-app-header {
            flex-shrink: 0;
            padding: max(20px, env(safe-area-inset-top, 20px)) 24px 18px;
            text-align: center;
            background: rgba(248, 246, 240, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 10;
        }

        .hmw-brand-badge {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--primary);
            background: var(--primary-light);
            padding: 5px 12px;
            border-radius: 20px;
        }

        #hmw-assessment-container h2 {
            font-size: clamp(1.3rem, 4vw, 1.6rem);
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.02em;
        }

        #hmw-assessment-container p.subtitle {
            color: var(--text-muted);
            font-size: clamp(0.85rem, 2.5vw, 0.95rem);
            font-weight: 500;
        }

        .hmw-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding: 24px;
            max-width: 680px;
            width: 100%;
            margin: 0 auto;
            gap: 24px;
        }

        .hmw-card-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 28px;
            box-shadow: var(--shadow-card);
            transition: var(--transition);
        }

        .hmw-select-wrapper {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .hmw-select-wrapper label {
            font-weight: 600;
            font-size: 1rem;
            color: var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hmw-input-group {
            display: flex;
            gap: 12px;
        }

        .hmw-select-wrapper select, 
        .hmw-select-wrapper input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            background: #FAFAFC;
            font-family: inherit;
            font-size: 1rem;
            color: var(--text-main);
            font-weight: 500;
            outline: none;
            transition: var(--transition);
        }

        .hmw-select-wrapper select:focus, 
        .hmw-select-wrapper input:focus {
            border-color: var(--border-focus);
            background: var(--bg-card);
            box-shadow: 0 0 0 4px rgba(44, 74, 62, 0.08);
        }

        .hmw-initials-display-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 22px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-subtle);
        }

        .hmw-initials-display-card span {
            font-weight: 500;
            color: var(--text-muted);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hmw-initials-display-card strong {
            color: var(--primary);
            background: var(--primary-light);
            padding: 4px 12px;
            border-radius: var(--radius-sm);
            font-family: monospace;
            font-size: 1.05rem;
        }

        .hmw-text-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 6px 12px;
            border-radius: 8px;
            transition: var(--transition);
        }

        .hmw-text-btn:hover {
            background: var(--primary-light);
        }

        #hmw-quiz-form {
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
            gap: 20px;
            min-height: 100%;
        }

        .hmw-questions-container {
            display: flex;
            flex-direction: column;
        }

        .hmw-question-card {
            display: none;
            flex-direction: column;
            gap: 24px;
            animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .hmw-question-card.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Redesigned bottom progress meta bar for supreme aesthetic and breathing room */
        .hmw-question-footer-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px dashed var(--border);
        }

        .hmw-q-badge-bottom {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--primary);
            background: var(--primary-light);
            padding: 6px 14px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .hmw-question-text {
            font-size: clamp(1.15rem, 3.8vw, 1.35rem);
            font-weight: 600;
            line-height: 1.5;
            color: var(--text-main);
        }

        .hmw-options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .hmw-option-label {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px 22px;
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-main);
            transition: var(--transition);
            box-shadow: var(--shadow-subtle);
        }

        .hmw-option-label:hover {
            border-color: #CBDCE3;
            background: #FCFDFD;
            transform: translateY(-1px);
        }

        .hmw-option-label input[type="radio"] {
            appearance: none;
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border: 2px solid #CBD5E1;
            border-radius: 50%;
            outline: none;
            transition: var(--transition);
            position: relative;
            display: grid;
            place-content: center;
            flex-shrink: 0;
        }

        .hmw-option-label input[type="radio"]::before {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 50%;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            background: #FFFFFF;
        }

        .hmw-option-label input[type="radio"]:checked {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        .hmw-option-label input[type="radio"]:checked::before {
            transform: scale(1);
        }

        .hmw-option-label:has(input[type="radio"]:checked) {
            border-color: var(--primary);
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 600;
            box-shadow: 0 4px 16px rgba(44, 74, 62, 0.08);
        }

        .hmw-nav-buttons {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0 10px;
            margin-top: auto;
            border-top: 1px solid var(--border);
        }
